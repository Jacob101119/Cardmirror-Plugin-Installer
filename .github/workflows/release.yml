
name: Create Plugin Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (example: 1.0.1). Leave blank to increment automatically."
        required: false
        type: string
        default: ""
      release_notes:
        description: "Optional release notes. Leave blank to generate automatically."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          git fetch --tags --force

          if [ -n "$OVERRIDE" ]; then
            VERSION="${OVERRIDE#v}"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)

            if [ -z "$LATEST_TAG" ]; then
              VERSION="0.1.1"
            else
              CURRENT="${LATEST_TAG#v}"

              if [[ ! "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Invalid latest tag: $LATEST_TAG"
                exit 1
              fi

              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi

          # One-time floor: never release below v1.0.0. Once we're at or past
          # it this does nothing. Skipped when a version is given explicitly.
          if [ -z "$OVERRIDE" ]; then
            MIN_VERSION="1.0.0"
            VERSION="$(printf '%s\n%s\n' "$VERSION" "$MIN_VERSION" | sort -V | tail -n1)"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify plugin files
        run: |
          test -f cardmirror-plugin.json
          test -f plugin.js

      - name: Update manifest and plugin version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg version "$VERSION" \
            '.version = $version' \
            cardmirror-plugin.json > manifest.tmp

          mv manifest.tmp cardmirror-plugin.json

          # The manager compares this constant against the released manifest
          # to decide whether to self-update, so keep them in sync.
          sed -i -E "s/var PM_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'/var PM_VERSION = '$VERSION'/" plugin.js
          grep -q "var PM_VERSION = '$VERSION'" plugin.js

      - name: Commit updated manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cardmirror-plugin.json plugin.js
          git commit -m "chore: release v$VERSION" || echo "No manifest changes"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "$TAG" \
              cardmirror-plugin.json \
              plugin.js \
              --title "$TAG" \
              --notes "$RELEASE_NOTES" \
              --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              cardmirror-plugin.json \
              plugin.js \
              --title "$TAG" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi

      - name: Delete older releases (keep this one; keep tags)
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.version.outputs.tag }}
        run: |
          # Keep only the release we just created. Git tags are left in place so
          # the manager's self-update (which reads plugin.js by tag) keeps working
          # and version numbers keep incrementing correctly.
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName --jq '.[].tagName' \
            | grep -vx "$KEEP" \
            | while IFS= read -r tag; do
                [ -n "$tag" ] || continue
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes
              done
